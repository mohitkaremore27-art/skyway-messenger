<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuickConnect - Secure Messenger</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <!-- LOGIN / SIGNUP SCREEN -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-box">
            <h2>KuickConnect</h2>
            <p class="subtitle">Secure Real-Time Messaging</p>
            <input type="text" id="username" placeholder="Unique Username (e.g. mohit123)">
            <input type="password" id="password" placeholder="Password">
            <div class="btn-group">
                <button id="signup-btn" class="btn secondary-btn">Sign Up</button>
                <button id="login-btn" class="btn primary-btn">Login</button>
            </div>
            <p id="auth-message"></p>
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen" class="chat-container" style="display: none;">
        
        <!-- Sidebar (Contacts, Search & Profile) -->
        <div class="sidebar" id="sidebar">
            <div class="profile-header">
                <div>
                    <h3 id="my-username"></h3>
                    <span id="my-status-text" class="status-badge online">● Online</span>
                </div>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>
            
            <hr class="divider">

            <!-- Save Contact / Search Section -->
            <div class="search-section">
                <label>Add / Open Contact:</label>
                <div class="search-box-row">
                    <input type="text" id="search-user" placeholder="Enter Unique ID...">
                    <button id="chat-btn" class="btn primary-btn">Open</button>
                </div>
            </div>

            <hr class="divider">

            <!-- Saved Contacts / Recent Chats List -->
            <div class="contacts-container">
                <label>Saved Contacts:</label>
                <div id="contacts-list" class="contacts-list">
                    <!-- Saved contacts will appear here dynamically -->
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area" id="chat-area">
            <div class="header">
                <button id="back-to-sidebar" class="back-btn" style="display: none;">← Back</button>
                <div>
                    <h3 id="chat-with">Select a user to start chatting</h3>
                    <span id="target-user-status" class="target-status"></span>
                </div>
            </div>
            
            <div id="messages" class="messages-box"></div>
            
            <!-- Typing Indicator Box -->
            <div id="typing-indicator" class="typing-indicator" style="display: none;">Typing...</div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message...">
                <button id="send-btn" class="btn primary-btn">Send</button>
            </div>
        </div>
    </div>

    <!-- Link JS File -->
    <script src="app.js"></script>
</body>
</html>
